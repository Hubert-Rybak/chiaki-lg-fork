name: Build IPK

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*.*.*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CHIAKI_NG_REF: 83b293983dd950d56c35dd8cb3717841d80838ea
  RELEASE_APP_ID: org.homebrew.chiaki.fork
  DEV_APP_ID: org.homebrew.chiaki.fork.dev
  WEBOS_NDK_VERSION: webos-a38c582
  WEBOS_NDK_SHA256: 04ad3311b48b4557a7002aef56ae2e167478e8e129f37daac04649bddf813616
  ARES_CLI_VERSION: v0.5.0
  ARES_CLI_SHA256: 7afce7bebb0da5b87b6e0a6603ad3bcf5596efb563999af9122f96acbd20699b
  NANOPB_VERSION: 0.4.9.1
  PYTHON_PROTOBUF_VERSION: 5.28.3
  GRPCIO_TOOLS_VERSION: 1.68.0
  SDL2_WEBOS_RELEASE: release-2.30.12-webos.5
  SDL2_WEBOS_VERSION: 2.30.12
  SDL2_WEBOS_SONAME: libSDL2-2.0.so.0.3000.12
  SDL2_WEBOS_SHA256: 4ad566453d113bdd9ee96878176b97d28d9fa70503a62d83d55a351545abb334

jobs:
  build-ipk:
    name: Build webOS IPK
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    outputs:
      artifact_name: ${{ steps.build-metadata.outputs.artifact_name }}
      release_version: ${{ steps.build-metadata.outputs.release_version }}

    steps:
      - name: Check out chiaki-lg
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select build configuration
        id: build-metadata
        shell: bash
        run: |
          build_tree="$(git rev-parse HEAD)"
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            build_commit="$(python3 -c 'import json, os; print(json.load(open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8"))["pull_request"]["head"]["sha"])')"
          else
            build_commit="$build_tree"
          fi
          build_commit_short="${build_commit:0:8}"

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Release tags must use the vMAJOR.MINOR.PATCH format." >&2
              exit 1
            fi

            version="${GITHUB_REF_NAME#v}"
            build_type="Release"
            app_id="$RELEASE_APP_ID"
            app_title="Chiaki-lg Fork"
            app_description="PlayStation Remote Play (PS4 / PS5)"
            artifact_name="chiaki-lg-fork-${GITHUB_REF_NAME}"
          else
            version="$(python3 -c 'import json; print(json.load(open("packaging/appinfo.json", encoding="utf-8"))["version"])')"
            build_type="Debug"
            app_id="$DEV_APP_ID"
            app_title="Chiaki Dev $build_commit_short"
            app_description="Development build $build_commit"
            artifact_name="chiaki-lg-fork-dev-$build_commit_short"

            cp packaging/icon-dev.png packaging/icon.png
            cp packaging/icon-dev.png packaging/largeIcon.png
          fi

          python3 - "$version" "$app_id" "$app_title" "$app_description" <<'PY'
          import json
          import pathlib
          import sys

          path = pathlib.Path("packaging/appinfo.json")
          appinfo = json.loads(path.read_text(encoding="utf-8"))
          appinfo["version"] = sys.argv[1]
          appinfo["id"] = sys.argv[2]
          appinfo["title"] = sys.argv[3]
          appinfo["appDescription"] = sys.argv[4]
          path.write_text(json.dumps(appinfo, indent=2) + "\n", encoding="utf-8")
          PY

          {
            echo "WEBOS_BUILD_TYPE=$build_type"
            echo "PACKAGE_VERSION=$version"
            echo "CHIAKI_APP_ID=$app_id"
            echo "WEBOS_APP_TITLE=$app_title"
            echo "WEBOS_APP_DESCRIPTION=$app_description"
            echo "BUILD_COMMIT=$build_commit"
            echo "BUILD_COMMIT_SHORT=$build_commit_short"
          } >> "$GITHUB_ENV"
          {
            echo "artifact_name=$artifact_name"
            echo "release_version=$version"
          } >> "$GITHUB_OUTPUT"

          echo "Building $build_type IPK version $version ($app_id)"
          echo "Source commit: $build_commit (checked-out tree: $build_tree)"

      - name: Check out chiaki-ng
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: streetpea/chiaki-ng
          ref: ${{ env.CHIAKI_NG_REF }}
          path: chiaki-ng
          persist-credentials: false

      - name: Initialize required chiaki-ng submodule
        shell: bash
        run: git -C chiaki-ng submodule update --init --depth 1 third-party/nanopb

      - name: Install host build tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            autoconf \
            automake \
            build-essential \
            cmake \
            git \
            gcc-aarch64-linux-gnu \
            bc \
            bison \
            flex \
            kmod \
            libtool \
            libssl-dev \
            make \
            ninja-build \
            pkg-config \
            protobuf-compiler \
            python3-pip \
            wget \
            xz-utils

      - name: Test config import
        shell: bash
        run: |
          cc -std=c11 -Wall -Wextra -Isrc \
            tests/config_import_test.c \
            -o "$RUNNER_TEMP/config-import-test"
          "$RUNNER_TEMP/config-import-test"

      - name: Test DualSense Bluetooth protocol
        shell: bash
        run: |
          cc -std=c11 -Wall -Wextra -Werror -Isrc \
            tests/dualsense_test.c src/dualsense.c \
            -pthread \
            -o "$RUNNER_TEMP/dualsense-test"
          "$RUNNER_TEMP/dualsense-test"

      - name: Test root bootstrap and scripts
        shell: bash
        run: |
          cc -std=c11 -Wall -Wextra -Werror -Isrc \
            -c src/root_feedback.c \
            -o "$RUNNER_TEMP/root-feedback.o"
          sh -n \
            packaging/root/install.sh \
            packaging/root/load.sh \
            packaging/root/boot-hook.sh \
            packaging/root/uninstall.sh

      - name: Build webOS 4.4 DualSense kernel module
        shell: bash
        run: |
          bash kernel/build-webos-module.sh \
            "$RUNNER_TEMP/linux-4.4-module" \
            packaging/root/modules/aarch64/4.4.84/lg1212

      - name: Install nanopb generator dependencies
        shell: bash
        run: |
          python3 -m pip install --user --disable-pip-version-check \
            "nanopb==${NANOPB_VERSION}" \
            "protobuf==${PYTHON_PROTOBUF_VERSION}" \
            "grpcio-tools==${GRPCIO_TOOLS_VERSION}"

      - name: Install webOS NDK
        shell: bash
        run: |
          archive="$RUNNER_TEMP/arm-webos-linux-gnueabi_sdk-buildroot-x86_64.tar.gz"
          install_dir="$RUNNER_TEMP/webos-ndk"
          url="https://github.com/openlgtv/buildroot-nc4/releases/download/${WEBOS_NDK_VERSION}/arm-webos-linux-gnueabi_sdk-buildroot-x86_64.tar.gz"

          curl --fail --location --retry 5 --output "$archive" "$url"
          echo "${WEBOS_NDK_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir -p "$install_dir"
          tar xzf "$archive" -C "$install_dir"

          toolchain_dir="$install_dir/arm-webos-linux-gnueabi_sdk-buildroot"
          "$toolchain_dir/relocate-sdk.sh"
          test -f "$toolchain_dir/share/buildroot/toolchainfile.cmake"
          echo "TOOLCHAIN_DIR=$toolchain_dir" >> "$GITHUB_ENV"

      - name: Install ares-package
        shell: bash
        run: |
          archive="$RUNNER_TEMP/ares-cli-rs-${ARES_CLI_VERSION}-linux-x86_64.tar.gz"
          install_dir="$RUNNER_TEMP/ares-cli"
          url="https://github.com/webosbrew/ares-cli-rs/releases/download/${ARES_CLI_VERSION}/ares-cli-rs-${ARES_CLI_VERSION}-linux-x86_64.tar.gz"

          curl --fail --location --retry 5 --output "$archive" "$url"
          echo "${ARES_CLI_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir -p "$install_dir"
          tar xzf "$archive" -C "$install_dir"
          sudo install -m 0755 \
            "$install_dir/ares-cli-rs-${ARES_CLI_VERSION}-linux-x86_64/ares-package" \
            /usr/local/bin/ares-package
          ares-package --help >/dev/null

      - name: Restore cross-compiled dependency cache
        id: cross-deps-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/webos-staging
          key: webos-deps-v1-${{ runner.os }}-${{ hashFiles('build-webos.sh') }}

      - name: Build IPK
        shell: bash
        run: bash ./build-webos.sh "$GITHUB_WORKSPACE/chiaki-ng"

      - name: Add source revision to development IPK filename
        if: env.WEBOS_BUILD_TYPE == 'Debug'
        shell: bash
        run: |
          shopt -s nullglob
          ipks=(build-webos/*.ipk)
          if (( ${#ipks[@]} != 1 )); then
            echo "Expected exactly one IPK before revision naming, found ${#ipks[@]}." >&2
            exit 1
          fi

          source_ipk="${ipks[0]}"
          stem="${source_ipk%.ipk}"
          architecture="${stem##*_}"
          package_and_version="${stem%_*}"
          revisioned_ipk="${package_and_version}+${BUILD_COMMIT_SHORT}_${architecture}.ipk"
          mv "$source_ipk" "$revisioned_ipk"
          echo "Development IPK: $revisioned_ipk"

      - name: Save cross-compiled dependency cache
        if: steps.cross-deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/webos-staging
          key: webos-deps-v1-${{ runner.os }}-${{ hashFiles('build-webos.sh') }}

      - name: Verify IPK
        shell: bash
        run: |
          shopt -s nullglob
          ipks=(build-webos/*.ipk)
          if (( ${#ipks[@]} != 1 )); then
            echo "Expected exactly one IPK in build-webos/, found ${#ipks[@]}." >&2
            exit 1
          fi

          for ipk in "${ipks[@]}"; do
            test -s "$ipk"
            file "$ipk"
            sha256sum "$ipk"
          done

          ipk_name="$(basename "${ipks[0]}")"
          if [[ "$ipk_name" != *"$CHIAKI_APP_ID"* ]]; then
            echo "IPK filename '$ipk_name' does not contain app ID '$CHIAKI_APP_ID'." >&2
            exit 1
          fi

          inspect_dir="$(mktemp -d "$RUNNER_TEMP/ipk-inspect.XXXXXX")"
          dpkg-deb --extract "${ipks[0]}" "$inspect_dir"
          packaged_appinfo="$(find "$inspect_dir" -type f -name appinfo.json -print -quit)"

          if [[ -z "$packaged_appinfo" ]]; then
            echo "Could not find appinfo.json inside ${ipks[0]}." >&2
            exit 1
          fi

          python3 - "$packaged_appinfo" "$CHIAKI_APP_ID" "$WEBOS_APP_TITLE" "$WEBOS_APP_DESCRIPTION" <<'PY'
          import json
          import pathlib
          import sys

          appinfo = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          if appinfo.get("id") != sys.argv[2]:
              raise SystemExit(f"Packaged app ID {appinfo.get('id')!r} != {sys.argv[2]!r}")
          if appinfo.get("title") != sys.argv[3]:
              raise SystemExit(f"Packaged title {appinfo.get('title')!r} != {sys.argv[3]!r}")
          if appinfo.get("appDescription") != sys.argv[4]:
              raise SystemExit(
                  f"Packaged description {appinfo.get('appDescription')!r} != {sys.argv[4]!r}"
              )
          PY

          packaged_root="$(dirname "$packaged_appinfo")"
          cmp packaging/icon.png "$packaged_root/icon.png"
          cmp packaging/largeIcon.png "$packaged_root/largeIcon.png"
          test -s "$packaged_root/lib/libSDL2-2.0.so.0"
          test -s "$packaged_root/THIRD-PARTY-NOTICES.md"
          test -s "$packaged_root/root/modules/aarch64/4.4.84/lg1212/hid-playstation.ko"
          test -s "$packaged_root/root/install.sh"
          test -s "$packaged_root/root/load.sh"
          test -s "$packaged_root/root/boot-hook.sh"
          test -s "$packaged_root/root/uninstall.sh"
          aarch64-linux-gnu-readelf -h \
            "$packaged_root/root/modules/aarch64/4.4.84/lg1212/hid-playstation.ko" \
            | grep -F 'Machine:' \
            | grep -F 'AArch64'

          packaged_binary="$(find "$inspect_dir" -type f -name chiaki-webos -print -quit)"
          if [[ -z "$packaged_binary" ]]; then
            echo "Could not find chiaki-webos inside ${ipks[0]}." >&2
            exit 1
          fi
          "$TOOLCHAIN_DIR/bin/arm-webos-linux-gnueabi-readelf" --dynamic "$packaged_binary" \
            | grep -F 'Shared library: [libSDL2-2.0.so.0]'

          if [[ "$WEBOS_BUILD_TYPE" == "Debug" ]]; then
            if [[ "$ipk_name" != *"+$BUILD_COMMIT_SHORT"* ]]; then
              echo "Development IPK filename '$ipk_name' does not contain commit '$BUILD_COMMIT_SHORT'." >&2
              exit 1
            fi

            sections="$("$TOOLCHAIN_DIR/bin/arm-webos-linux-gnueabi-readelf" --sections "$packaged_binary")"
            if ! grep -F '.debug_info' <<< "$sections" >/dev/null; then
              echo "Debug IPK executable does not contain a .debug_info section." >&2
              exit 1
            fi

            echo "Packaged executable contains .debug_info:"
            file "$packaged_binary"
          fi

      - name: Upload IPK artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.build-metadata.outputs.artifact_name }}
          path: build-webos/*.ipk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  release:
    name: Publish GitHub release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build-ipk
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Download release IPK
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build-ipk.outputs.artifact_name }}
          path: release-assets

      - name: Create release and attach IPK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.build-ipk.outputs.release_version }}
        run: |
          shopt -s nullglob
          ipks=(release-assets/*.ipk)
          if (( ${#ipks[@]} != 1 )); then
            echo "Expected exactly one release IPK, found ${#ipks[@]}." >&2
            exit 1
          fi

          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${ipks[@]}" \
              --clobber \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" "${ipks[@]}" \
              --generate-notes \
              --title "Chiaki-lg $RELEASE_VERSION" \
              --verify-tag \
              --repo "$GITHUB_REPOSITORY"
          fi
